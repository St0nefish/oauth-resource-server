name: Fuzz

# Runs each cargo-fuzz target in `fuzz/` for a bounded time. Nightly on
# `master` and on demand; deliberately NOT a pull-request or push trigger, so
# a fuzz run can never gate or slow a merge and a fork PR never reaches it.
# A crash fails the run and uploads the offending input as an artifact; it is
# reproduced locally with
#   cargo +nightly fuzz run <target> fuzz/artifacts/<target>/<crash-file>
#
# The targets are the crate's own parsers (see `src/__fuzz.rs`, which exists
# only under `--cfg fuzzing`, so none of this is public API): the `Bearer`
# header parser, the validator's header gate (`check_header`, `check_crit`,
# `check_typ`), scope/principal extraction, the RFC 9728 metadata URL/path
# builders, the discovery-URL builder and the per-entry JWK parse.
#
# GitHub-hosted, not the self-hosted runner: nothing here gates a merge, a
# long nightly job would tie the self-hosted runner up, and a scheduled run
# executes only what is already on `master`. The job holds a read-only token.
#
# Every action is pinned to a full commit SHA, with the release it
# corresponds to in a trailing comment (dtolnay/rust-toolchain publishes no
# releases, so it is pinned to a commit of its `master` branch).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        required: false
        default: "300"

permissions:
  contents: read

# One fuzz run at a time; a new nightly never cancels one already running.
concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - bearer_credential
          - check_header
          - extract_claims
          - metadata_urls
          - discovery_urls
          - jwks_entries
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust toolchain
        # cargo-fuzz needs nightly (sanitizer flags). This is not
        # rust-toolchain.toml's pin, so `+nightly` is named on every call.
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: nightly

      - name: Cache cargo registry, cargo-fuzz and fuzz build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: fuzz-build-${{ hashFiles('fuzz/Cargo.lock', 'Cargo.lock') }}
          restore-keys: fuzz-build-

      - name: Install cargo-fuzz
        # Pinned and --locked. taiki-e/install-action has no cargo-fuzz
        # manifest, so this builds it from crates.io, once per cache miss.
        run: command -v cargo-fuzz || cargo install --locked --version 0.13.2 cargo-fuzz

      - name: Restore the target's corpus
        # Inputs found by earlier runs, so each night starts where the last
        # one stopped instead of from nothing.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }}
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: |
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
            -max_total_time="${SECONDS_PER_TARGET}" -rss_limit_mb=2048

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
