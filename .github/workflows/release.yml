name: Release

# Publishes to crates.io when the maintainer publishes a GitHub release — and
# only then. A merge to `master` runs CI and nothing else.
#
# Cutting a release:
#   1. Merge a PR that bumps `version` in Cargo.toml (and Cargo.lock) and
#      moves CHANGELOG.md's `[Unreleased]` entries under a matching
#      `## [X.Y.Z] - <date>` heading, with its link reference at the bottom.
#   2. The maintainer creates the release for that commit:
#        gh release create vX.Y.Z --target master --title vX.Y.Z --notes "..."
#      or the same through the web UI. Publishing the release creates the
#      `vX.Y.Z` tag and starts this workflow. The notes given there are
#      replaced by the CHANGELOG section once the crate is published.
#
# Only a release a human publishes triggers this. GitHub starts no workflow
# run for a release created with GITHUB_TOKEN, and that is intended. A tag
# ruleset lets only repository admins create, move or delete `v*` tags, so
# neither GITHUB_TOKEN nor the auto-merge App can make a release tag, and
# nothing in this workflow ever creates or edits a tag. A prerelease is
# handled like any other release: a version such as `0.2.0-rc.1` is
# published to crates.io, where Cargo never picks a pre-release version
# unless a consumer asks for it explicitly.
#
#   check    GitHub-hosted, read-only. Checks out the tagged commit and
#            fails closed unless: the release's tag is `v<version>` for the
#            Cargo.toml version at that commit; that commit is an ancestor of
#            `master`; crates.io answers 404 for that version (200 fails the
#            first attempt, since the release is for a version that is
#            already published; any other answer always fails, so it never
#            publishes on an uncertain answer); and CHANGELOG.md has a
#            non-empty section for it (the release notes).
#   verify   Self-hosted, read-only, no OIDC permission: the same steps as
#   msrv     ci.yml's `checks` and `msrv` jobs, on the tagged commit.
#   publish  The only job with `id-token: write`, in the `release`
#            environment. Re-checks crates.io, then does nothing but
#            checkout, toolchain, crates.io authentication and
#            `cargo publish`.
#   release-notes
#            `contents: write` with GITHUB_TOKEN: replaces the release's
#            notes with the version's CHANGELOG section (`gh release edit`).
#            It never creates or moves a tag.
#
# `publish` runs on a GitHub-hosted runner, not the self-hosted one. The
# self-hosted runner has its host's Docker daemon socket mounted and runs
# code nobody has reviewed yet (Dependabot's PRs run there without approval,
# executing new upstream build scripts), so a job that can mint a crates.io
# token must not share that host. `verify` and `msrv` hold no such
# permission, so they stay self-hosted.
#
# 0.1.0 was published manually with a personal API token, because crates.io
# only lets a trusted publisher be attached to a crate that already exists.
# Trusted publishing is configured on crates.io for this repository, this
# workflow file (`release.yml`) and the GitHub environment `release`, whose
# deployment policy admits only `v*` tags. So this file must keep its name
# and `publish` must keep `environment: release`: that environment policy,
# together with the tag ruleset, is what stops anything but an
# admin-created release tag from minting a publish token. No crates.io token
# is stored in this repository: `rust-lang/crates-io-auth-action` exchanges
# the job's OIDC token for a publish token valid for that one run.
#
# Re-running is done with "re-run failed jobs" on the release's run; there is
# no manual trigger. Every stage is safe to repeat: `publish` re-checks
# crates.io and, on a re-run, skips the upload and succeeds if an earlier
# attempt already made it, so `release-notes` still runs; `release-notes`
# only ever overwrites the notes with the same text.
#
# Every action is pinned to a full commit SHA, with the release it
# corresponds to in a trailing comment (dtolnay/rust-toolchain publishes no
# releases, so it is pinned to a commit of its `master` branch).

on:
  release:
    types: [published]

# One release at a time, and never cancel one that has started: an upload to
# crates.io cannot be taken back, so a run must always reach its release
# notes. The group is constant, not keyed by tag, because what is being
# serialized is publishing to the one crates.io crate.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history, so the ancestry check below has the commits it needs.
          fetch-depth: 0
          persist-credentials: false

      - name: Match the release tag to the tagged commit's Cargo.toml version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          semver='[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?'
          if [[ ! "$TAG" =~ ^v${semver}$ ]]; then
            echo "::error::release tag '${TAG}' is not of the form vX.Y.Z[-pre]"
            exit 1
          fi

          # For a release event GITHUB_SHA is the commit the tag named when
          # the release was published. Confirm the tag still names it and
          # that this checkout is that commit, rather than trust either.
          if [[ "$GITHUB_REF" != "refs/tags/${TAG}" ]]; then
            echo "::error::GITHUB_REF is ${GITHUB_REF}, expected refs/tags/${TAG}"
            exit 1
          fi
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          tag_commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [[ "$tag_commit" != "$GITHUB_SHA" || "$head_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::tag ${TAG} is at ${tag_commit} and the checkout at ${head_commit}, but the release event names ${GITHUB_SHA}"
            exit 1
          fi

          # The `version` key of the `[package]` table, without needing a
          # Rust toolchain on this runner.
          version=$(awk '
            /^\[/ { in_package = ($0 == "[package]") }
            in_package && /^version *=/ { sub(/^version *= *"/, ""); sub(/".*$/, ""); print; exit }
          ' Cargo.toml)
          if [[ ! "$version" =~ ^${semver}$ ]]; then
            echo "::error::could not read a valid version from Cargo.toml at ${GITHUB_SHA} (got '${version}')"
            exit 1
          fi
          if [[ "$TAG" != "v${version}" ]]; then
            echo "::error::release tag ${TAG} does not match Cargo.toml's version ${version} at ${GITHUB_SHA}. Bump the version in a merged PR first, then release that commit."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Require the tagged commit to be on master
        run: |
          # Fetch master explicitly and fail closed: a failed fetch or a
          # commit master does not contain both stop the release.
          git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          status=0
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || status=$?
          case "$status" in
            0)
              echo "${GITHUB_SHA} is on master"
              ;;
            1)
              echo "::error::${GITHUB_SHA} is not an ancestor of master. Release only a commit that has merged to master."
              exit 1
              ;;
            *)
              echo "::error::git merge-base failed (exit ${status}); cannot tell whether ${GITHUB_SHA} is on master."
              exit 1
              ;;
          esac

      - name: Require the version to be unpublished on crates.io
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://crates.io/api/v1/crates/oauth-resource-server/${VERSION}"
          # crates.io refuses API requests without a descriptive User-Agent.
          # `--retry` covers timeouts and 408/429/5xx; a 404 is an answer,
          # not an error, so it is never retried.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 5 --max-time 30 \
            -A "oauth-resource-server release workflow (https://github.com/${GITHUB_REPOSITORY})" \
            "$url") || code="curl exit $?"
          case "$code" in
            404)
              echo "oauth-resource-server ${VERSION} is not on crates.io yet — publishing it."
              ;;
            200)
              # On a re-run, an earlier attempt of this run may be what
              # uploaded it; `publish` then skips the upload and succeeds.
              if [ "${GITHUB_RUN_ATTEMPT}" -gt 1 ]; then
                echo "::notice::oauth-resource-server ${VERSION} is already on crates.io; this is a re-run, so continuing (publish will skip the upload)."
              else
                echo "::error::oauth-resource-server ${VERSION} is already on crates.io. This release is for a published version; bump the version and release that instead."
                exit 1
              fi
              ;;
            *)
              echo "::error::crates.io answered ${code} for ${url}; expected 404 (not yet published). Not publishing on an uncertain answer — re-run once crates.io is healthy."
              exit 1
              ;;
          esac

      - name: Require a non-empty CHANGELOG section for the version
        # The same extraction `release-notes` uses, so a missing or empty
        # section fails here, before anything is uploaded.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { in_section = 1; next }
            in_section && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            in_section { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release-notes.md"; then
            echo "::error::CHANGELOG.md's '## [${VERSION}]' section is missing or empty; the release notes are taken from it."
            exit 1
          fi

  # `verify` and `msrv` repeat ci.yml's `checks` and `msrv` jobs step for step
  # on the exact commit about to be published. They run every build script,
  # proc macro and dev-dependency the crate has, so they get no OIDC
  # permission — see `publish`.
  verify:
    needs: check
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install system dependencies
        # The `native-tls` feature builds against OpenSSL.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev

      - name: Read pinned Rust toolchain version
        # Same as ci.yml: rust-toolchain.toml's `channel` is the one source.
        id: rust_version
        run: |
          version=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/channel *= *"([^"]+)"/\1/')
          if [[ -z "$version" ]]; then
            echo "::error::could not parse channel from rust-toolchain.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-checks-${{ steps.rust_version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-checks-${{ steps.rust_version.outputs.version }}-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (native-tls only)
        run: cargo clippy --all-targets --no-default-features --features native-tls -- -D warnings

      - name: Clippy (rustls-tls-native-roots only)
        run: cargo clippy --all-targets --no-default-features --features rustls-tls-native-roots -- -D warnings

      - name: Tests (all features)
        run: cargo test --all-features

      - name: Tests (default features)
        run: cargo test

      - name: Build examples (all features)
        run: cargo build --examples --all-features

      - name: Build docs (-D warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

      - name: cargo package --list
        run: cargo package --list

      - name: cargo publish --dry-run
        run: cargo publish --dry-run

  msrv:
    needs: check
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install system dependencies
        # `--all-features` below includes `native-tls` (OpenSSL).
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/^rust-version *= *"([^"]+)".*/\1/')
          if [[ -z "$version" ]]; then
            echo "::error::could not resolve rust-version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-msrv-${{ steps.msrv.outputs.version }}-

      - name: Build on MSRV (all features)
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+${MSRV}" build --all-features --locked

  # The only job that can mint a crates.io token. Any step in a job with
  # `id-token: write` can request the OIDC token crates-io-auth-action
  # exchanges, so this job runs as little code as possible: no
  # dev-dependency, test or tooling install, and no restored cache (a cached
  # `target/` is build output this job did not produce). `cargo publish`'s
  # own verification build still runs the normal dependencies' build
  # scripts. GitHub-hosted, and in the `release` environment — see the header.
  publish:
    needs: [check, verify, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Is this version still unpublished?
        # Makes a re-run safe: if an earlier attempt of this run already
        # uploaded the crate, skip the upload and succeed, so
        # `release-notes` still runs. Same 200/404/anything-else rule as
        # `check`.
        id: recheck
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          url="https://crates.io/api/v1/crates/oauth-resource-server/${VERSION}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 5 --max-time 30 \
            -A "oauth-resource-server release workflow (https://github.com/${GITHUB_REPOSITORY})" \
            "$url") || code="curl exit $?"
          case "$code" in
            200)
              # Only a re-run may find its own upload. On the first attempt a
              # 200 means someone else published this version between `check`
              # and now, and claiming this release's commit for it would be
              # wrong.
              if [ "${GITHUB_RUN_ATTEMPT}" -le 1 ]; then
                echo "::error::oauth-resource-server ${VERSION} appeared on crates.io after the check job ran, from outside this run. Not attributing an upload this workflow did not make to this release."
                exit 1
              fi
              echo "upload=false" >> "$GITHUB_OUTPUT"
              echo "::notice::oauth-resource-server ${VERSION} is already on crates.io (an earlier attempt of this run uploaded it) — skipping the upload."
              ;;
            404)
              echo "upload=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io answered ${code} for ${url}; expected 200 or 404. Not publishing on an uncertain answer."
              exit 1
              ;;
          esac

      - name: Checkout the tagged commit
        if: steps.recheck.outputs.upload == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read pinned Rust toolchain version
        if: steps.recheck.outputs.upload == 'true'
        id: rust_version
        run: |
          version=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/channel *= *"([^"]+)"/\1/')
          if [[ -z "$version" ]]; then
            echo "::error::could not parse channel from rust-toolchain.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.recheck.outputs.upload == 'true'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}
          # Unused here, but rust-toolchain.toml lists them, and a toolchain
          # missing a listed component would leave rustup to fill it in.
          components: clippy, rustfmt

      - name: Authenticate with crates.io
        if: steps.recheck.outputs.upload == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: steps.recheck.outputs.upload == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cargo publish
          echo "### Published oauth-resource-server ${VERSION} to crates.io" >> "$GITHUB_STEP_SUMMARY"

  # Sets the release's notes to the CHANGELOG section once the crate is on
  # crates.io. Edits the existing release only — never creates a release or
  # a tag (the tag ruleset would refuse GITHUB_TOKEN anyway). Re-running it
  # writes the same notes again.
  release-notes:
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout the tagged commit
        # Only CHANGELOG.md is read; the release is edited through the API,
        # so the checkout needs no stored credentials.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Replace the release notes with the CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # The `## [X.Y.Z]` section, up to the next version heading or the
          # link-reference block at the end of the file. `check` already ran
          # this same extraction and required it to be non-empty.
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { in_section = 1; next }
            in_section && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            in_section { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release-notes.md"; then
            echo "::error::CHANGELOG.md's '## [${VERSION}]' section is empty or missing."
            exit 1
          fi

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
          echo "### Set the ${TAG} release notes from CHANGELOG.md" >> "$GITHUB_STEP_SUMMARY"
