name: Release

# Publishes to crates.io when the owner publishes a GitHub release — and only then. A
# release is the owner's act, never a side effect of a merge or a version change
# (pr-manual-release):
#   gh release create vX.Y.Z --target <full master sha> --title vX.Y.Z --generate-notes
# X.Y.Z is Cargo.toml's version at that commit (on master, always the NEXT release: the
# roll PR moves it one patch past every release). Pass the full sha: `master` as a target
# would carry along any PR merged in the meantime.
#
# Runs from the TAGGED commit's copy of this file and its scripts. It never builds or
# re-tests: the tree was tested before the merge (`ci-slow`) or right after it
# (master.yml's fallback), which master.yml records as the commit's `verified` status.
#
#   check    GitHub-hosted, read-only; fails closed unless: the sender is in
#            RELEASE_SENDERS (the owner only); not a draft or prerelease; the tag is
#            vX.Y.Z == Cargo.toml's version at the tagged commit, which is this run's
#            commit and on master; the tag is the highest stable v* tag; crates.io does
#            not have the version yet (a re-run may find its own upload); the commit
#            carries master.yml's `verified` status (waiting, bounded, for a master.yml
#            run still in progress). A docs-only commit inherits its parent's
#            `verified`; a version-only commit (the roll PR, a hand bump) has none, so
#            releasing it fails — release a commit with tested code under that version.
#   publish  the only job with `id-token: write`, GitHub-hosted, in the `release`
#            environment: re-checks crates.io and the highest-tag rule, then
#            crates-io-auth-action and `cargo publish --no-verify` (ci-fast's
#            `cargo publish --dry-run` already built the package from this tree).
#   notes    an empty release body gets CHANGELOG.md's `[Unreleased]` section, or else
#            GitHub's generated notes; a body the owner wrote (or --generate-notes
#            filled) is left alone
#   roll     only after everything shipped, as the App: opens and arms the PR moving
#            master's version to the next patch (cargo release version patch, plus
#            CHANGELOG.md's `[Unreleased]` dated as the release), unless master's version
#            already moved. It lands like any PR, without running the slow tier.
#
# Only the owner can cause a publish:
#   - the `release tags` ruleset on `refs/tags/v*` lets only repository admins (the
#     owner) create, move or delete a `v*` tag; GITHUB_TOKEN and the App cannot;
#   - the `release` environment admits only `v*` tags, so `publish` cannot run from a
#     branch;
#   - `check` refuses a release whose sender is not in RELEASE_SENDERS;
#   - crates.io trusted publishing is registered for this repository + `release.yml` +
#     environment `release`. So this file must keep its name and `publish` must keep
#     `environment: release`. No crates.io token is stored anywhere:
#     rust-lang/crates-io-auth-action exchanges the job's OIDC token for a publish token
#     valid for that one run.
# The ancestry-to-master check is a mistake catcher, not a boundary: the run uses the
# workflow file at the tagged commit.
#
# `publish` runs on a GitHub-hosted runner, never the self-hosted one (which mounts its
# host's docker socket and runs the slow tier), and runs as little code as possible: no
# dev-dependency, test or tooling install, no restored cache.
#
# Recovery: a transient failure (crates.io outage, runner hiccup) -> "re-run failed jobs"
# on the release's run; every job is idempotent (`publish` skips the upload when an
# earlier attempt of this run made it). A genuinely broken commit: as the owner
# `gh release delete vX.Y.Z --cleanup-tag`, merge the fix (master still holds X.Y.Z,
# since `roll` runs only after `publish`), release again. 0.1.0 was published manually
# with a personal token, because crates.io only lets a trusted publisher be attached to a
# crate that already exists.
#
# Every action is pinned to a full commit SHA, with the release it corresponds to in a
# trailing comment (dtolnay/rust-toolchain publishes no releases, so it is pinned to a
# commit of its `master` branch).

on:
  release:
    types: [published]

# One run per tag, never cancelled: an upload to crates.io cannot be taken back, so a run
# must always reach its notes and roll. A newer release gets a group of its own.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Logins whose published release may ship (space-separated). The owner only: no bot
  # creates releases.
  RELEASE_SENDERS: "St0nefish"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: read
      actions: read
    outputs:
      crate: ${{ steps.meta.outputs.crate }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Require a stable, non-draft release from an allowed sender
        env:
          SENDER: ${{ github.event.sender.login }}
          DRAFT: ${{ github.event.release.draft }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          allowed=false
          for s in ${RELEASE_SENDERS}; do
            if [[ -n "$SENDER" && "$SENDER" == "$s" ]]; then allowed=true; fi
          done
          if [[ "$allowed" != true ]]; then
            echo "::error::this release was published by '${SENDER}', not one of: ${RELEASE_SENDERS}."
            exit 1
          fi
          if [[ "$DRAFT" != false || "$PRERELEASE" != false ]]; then
            echo "::error::draft/prerelease releases are not shipped (draft=${DRAFT}, prerelease=${PRERELEASE})."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '${TAG}' is not vX.Y.Z."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/${TAG}" ]]; then
            echo "::error::GITHUB_REF is ${GITHUB_REF}, expected refs/tags/${TAG}"
            exit 1
          fi

      # Public repository: the guards below fetch and `git ls-remote` without credentials.
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read crate metadata at the tagged commit
        id: meta
        run: |
          .github/scripts/crate-meta.sh
          grep -qx 'canonical=true' "$GITHUB_OUTPUT" || { echo "::error::not the canonical repository; nothing is published from here."; exit 1; }

      - name: Require tag == Cargo.toml version
        env:
          TAG: ${{ github.event.release.tag_name }}
          CARGO_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [[ "$TAG" != "$CARGO_TAG" ]]; then
            echo "::error::release tag ${TAG} does not match Cargo.toml's version (${CARGO_TAG}) at ${GITHUB_SHA}."
            exit 1
          fi
          echo "${TAG} == Cargo.toml's version at ${GITHUB_SHA}"

      - name: Require the tag at this run's commit, on master
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --quiet --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}" "+refs/heads/master:refs/remotes/origin/master"
          tag_commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if [[ "$tag_commit" != "$GITHUB_SHA" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::tag ${TAG} is at ${tag_commit}, the checkout at $(git rev-parse HEAD), the event names ${GITHUB_SHA}."
            exit 1
          fi
          status=0
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || status=$?
          case "$status" in
            0) echo "${GITHUB_SHA} is on master" ;;
            1) echo "::error::${GITHUB_SHA} is not on master. Release only a merged commit."; exit 1 ;;
            *) echo "::error::git merge-base failed (exit ${status})."; exit 1 ;;
          esac

      - name: Require the highest stable release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: .github/scripts/require-highest-tag.sh "$TAG"

      - name: Require the version to be unpublished on crates.io
        env:
          CRATE: ${{ steps.meta.outputs.crate }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          url="https://crates.io/api/v1/crates/${CRATE}/${VERSION}"
          # crates.io refuses API requests without a descriptive User-Agent. `--retry`
          # covers timeouts and 408/429/5xx; a 404 is an answer, never retried.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 5 --max-time 30 \
            -A "${CRATE} release workflow (https://github.com/${GITHUB_REPOSITORY})" \
            "$url") || code="curl exit $?"
          case "$code" in
            404) echo "${CRATE} ${VERSION} is not on crates.io yet." ;;
            200)
              # On a re-run, an earlier attempt of this run may be what uploaded it;
              # `publish` then skips the upload and succeeds.
              if [[ "${GITHUB_RUN_ATTEMPT}" -gt 1 ]]; then
                echo "::notice::${CRATE} ${VERSION} is already on crates.io; this is a re-run, so continuing (publish skips the upload)."
              else
                echo "::error::${CRATE} ${VERSION} is already on crates.io. Versions are permanent; release the next version instead."
                exit 1
              fi
              ;;
            *)
              echo "::error::crates.io answered ${code} for ${url}; expected 404. Not publishing on an uncertain answer — re-run once crates.io is healthy."
              exit 1
              ;;
          esac

      - name: Require the verified status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck source=/dev/null
          . .github/scripts/status-lib.sh
          deadline=$((SECONDS + 1200))
          while :; do
            st=$(latest_status "$GITHUB_SHA" verified)
            if [[ "$st" == success* ]]; then
              echo "verified: ${st#success }"
              exit 0
            fi
            running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow master.yml --commit "$GITHUB_SHA" \
              --json status --jq '[.[] | select(.status != "completed")] | length')
            if [[ "$running" == 0 || $SECONDS -ge $deadline ]]; then
              echo "::error::${GITHUB_SHA} has no 'verified' success (${st:-no status}): its tree was never proven tested. A version-only commit (the roll PR, a hand bump) has none; release a commit with tested code."
              exit 1
            fi
            sleep 20
          done

  # The only job that can mint a crates.io token: any step in a job with `id-token: write`
  # can request the OIDC token crates-io-auth-action exchanges, so it runs only checkout,
  # the toolchain, the plain git/coreutils highest-tag re-check, the auth action and
  # `cargo publish --no-verify` (no build, so no build script or proc macro runs here).
  publish:
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      CRATE: ${{ needs.check.outputs.crate }}
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Is this version still unpublished?
        # Makes a re-run safe: an earlier attempt of this run that already uploaded the
        # crate makes this skip the upload and succeed.
        id: recheck
        run: |
          url="https://crates.io/api/v1/crates/${CRATE}/${VERSION}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 5 --max-time 30 \
            -A "${CRATE} release workflow (https://github.com/${GITHUB_REPOSITORY})" \
            "$url") || code="curl exit $?"
          case "$code" in
            200)
              # Only a re-run may find its own upload. On the first attempt a 200 means
              # someone else published this version since `check` ran.
              if [[ "${GITHUB_RUN_ATTEMPT}" -le 1 ]]; then
                echo "::error::${CRATE} ${VERSION} appeared on crates.io after check ran, from outside this run."
                exit 1
              fi
              echo "upload=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${CRATE} ${VERSION} is already on crates.io (an earlier attempt of this run uploaded it); skipping the upload."
              ;;
            404) echo "upload=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::crates.io answered ${code} for ${url}; expected 200 or 404. Not publishing on an uncertain answer."
              exit 1
              ;;
          esac

      - name: Checkout the tagged commit
        if: steps.recheck.outputs.upload == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read pinned Rust toolchain version
        if: steps.recheck.outputs.upload == 'true'
        id: rust_version
        run: |
          version=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/channel *= *"([^"]+)"/\1/')
          [[ -n "$version" ]] || { echo "::error::could not parse channel from rust-toolchain.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.recheck.outputs.upload == 'true'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-09-12
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}
          # Unused here, but rust-toolchain.toml lists them, and a toolchain missing a
          # listed component would leave rustup to fill it in.
          components: clippy, rustfmt

      - name: Require the highest stable release tag (again)
        # `check`'s guard again, immediately before the token is minted, so a release
        # published since `check` ran is seen. Before authentication, so a refusal never
        # mints a token.
        if: steps.recheck.outputs.upload == 'true'
        run: .github/scripts/require-highest-tag.sh "$TAG"

      - name: Authenticate with crates.io
        if: steps.recheck.outputs.upload == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: steps.recheck.outputs.upload == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish --no-verify --locked
          echo "### Published ${CRATE} ${VERSION} to crates.io" >> "$GITHUB_STEP_SUMMARY"

  notes:
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Edits the existing release only; never creates a release or a tag (the tag
      # ruleset would refuse GITHUB_TOKEN anyway).
      - name: Fill empty release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: .github/scripts/release-notes.sh "$TAG"

  roll:
    needs: [check, publish, notes]
    # Only after everything shipped: until then master keeps X.Y.Z, so a failed release is
    # fixed and re-released under the same version.
    if: ${{ !cancelled() && needs.check.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The App, never GITHUB_TOKEN: a PR or arming made with GITHUB_TOKEN starts no
      # workflow, so the roll PR would never get ci-fast or ci-slow.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Master's copy of roll.sh; the App token stays in the checkout so the push is the
      # App's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Read pinned Rust toolchain version
        id: rust_version
        run: |
          version=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/channel *= *"([^"]+)"/\1/')
          [[ -n "$version" ]] || { echo "::error::could not parse channel from rust-toolchain.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-09-12
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}
          components: clippy, rustfmt

      - name: Install cargo-release
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-release

      - name: Open and arm the roll PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RELEASED: ${{ needs.check.outputs.version }}
        run: .github/scripts/roll.sh "$RELEASED"
