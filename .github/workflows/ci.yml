name: CI

# LEGACY gate, being replaced by pr-manual-release (ci-fast.yml, slow-trigger.yml,
# slow.yml, checks.yml, master.yml). It stays only until the required checks move
# from `ci-pass` to `ci-fast` + `ci-slow`; it releases nothing.
#
# pr-manual-release gating: `ci-pass` is the one status check the repository ruleset
# requires. It runs no build steps of its own — it just fails unless every
# job named in its `needs:` succeeded, so adding a job here only strengthens
# the gate if it is added to both `needs:` and the explicit result check in
# `ci-pass` below (a bare `needs:` with no `if: always()` would make GitHub
# *skip*, not fail, `ci-pass` when an upstream job fails, and a skipped
# required check is treated as passing — see `ci-pass`'s own comment).
#
# The heavy jobs (`checks`, `msrv`, `semver`, `feature-powerset`,
# `minimal-versions`) run on the project's self-hosted runner,
# an ephemeral container: every job starts from a clean image, so nothing
# carries over between runs except what `actions/cache` restores. A pull
# request from a fork only runs after a maintainer approves the run. That
# gate does not cover every change nobody has reviewed yet: Dependabot opens
# its PRs from branches of this repository, so they run here without
# approval, and a dependency bump executes the new upstream version's build
# scripts (and proc macros, and tests) on the self-hosted runner. That is
# accepted, knowing the runner mounts the host docker socket, so such code
# can reach the host beyond its own ephemeral container. The mitigation is
# that nothing secret lives on that runner: these jobs hold only a read-only
# token, and the job that holds a write credential — release.yml's `publish` —
# runs on a GitHub-hosted runner.
# `ci-pass` is a pure result check and stays on a GitHub-hosted runner.
#
# `checks` builds once with the toolchain pinned in `rust-toolchain.toml`
# and runs everything that toolchain needs to cover:
# formatting, clippy across the feature combinations that matter (all
# features together, the default feature set, and native-tls and
# rustls-tls-native-roots each alone — those exist because `--all-features`
# hides a `cfg` that only appears when `rustls-tls` is off, since the TLS
# backends are additive, not mutually exclusive; and tower alone and
# metrics+mcp without axum, because `--all-features` also hides an item
# only the axum module reads), tests, a `-D warnings` doc build (every public item
# needs a doc comment — see `#![warn(missing_docs)]` in `src/lib.rs`),
# `cargo audit`, `cargo deny check` (advisories, licenses, bans and sources, per
# `deny.toml`), and the packaging checks (`cargo package --list` and
# `cargo publish --dry-run`) that catch a metadata mistake before a release
# ever reaches `release.yml`. `release.yml`'s `verify` and `msrv` jobs
# repeat these steps before a publish, and its `semver` job repeats `semver`
# below; keep the lists in step. (`feature-powerset` and `minimal-versions` are not
# repeated there: they ran on master's post-merge CI, and are not re-verified
# at release.)
#
# Three more jobs are separate from `checks` because each wants its own
# toolchain or its own fresh dependency resolution, and running them alongside
# keeps the wall-clock time at the slowest one:
#   `semver`            cargo-semver-checks against the latest release on
#                       crates.io, so an accidental breaking change fails CI.
#                       Runs on rust 1.93 with cargo-semver-checks 0.50.0, both
#                       pinned and moved together (see the job), not the
#                       toolchain in rust-toolchain.toml.
#   `feature-powerset`  cargo-hack builds every feature combination that can
#                       compile (one TLS backend each, see the step).
#   `minimal-versions`  builds against the oldest release every dependency
#                       requirement allows, so a lower bound in Cargo.toml that
#                       is too low fails CI. It rewrites Cargo.lock, which is
#                       why it is not a step of `checks`.
# Fuzzing runs after a merge to `master`, never as a PR job: see `fuzz.yml`.
#
# `msrv` is a separate job on a separate, explicitly-installed toolchain
# (read from `Cargo.toml`'s `rust-version`, not from `rust-toolchain.toml` —
# see that file's header comment for why) so a change that only compiles on
# a newer compiler than the crate's stated MSRV fails CI instead of shipping
# quietly.
#
# The `push` trigger on `master` is the post-merge re-run. The ruleset does
# not require a PR branch to be up to date with `master` before it merges, so
# two PRs each green against an older base can still combine into a broken
# `master`; re-running the full gate on every push to `master` catches that
# immediately. There is deliberately no separate `post-merge.yml` — this
# workflow already is one, and a second would only duplicate the build.
#
# Every action is pinned to a full commit SHA, with the release it
# corresponds to in a trailing comment (dtolnay/rust-toolchain publishes no
# releases, so it is pinned to a commit of its `master` branch).

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Least-privilege default for every job; none writes anything.
permissions:
  contents: read

# PR runs and post-merge runs live in separate groups. A PR's group is keyed
# by its number and cancels a superseded run of the same PR. A post-merge run's
# group is keyed by its commit and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-master-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap, GitHub-hosted gate: `code` is 'false' only when every changed file is
  # Claude Code configuration (`.claude/**`, `CLAUDE.md`, `.claude-plugin/**`),
  # in which case the heavy jobs below are skipped. A path filter on the
  # trigger is not used because a workflow it skips never reports `ci-pass`,
  # which would leave the required check pending. Fails closed: any error
  # listing the changed files, or 300+ files, counts as a code change.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect non-Claude-config changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if files=$(gh api "repos/${REPO}/compare/${BASE}...${HEAD}" --jq '.files | if length >= 300 then empty else .[].filename end' 2>/dev/null) && [[ -n "$files" ]]; then
            if ! grep -qvE '^(\.claude/|\.claude-plugin/|CLAUDE\.md$)' <<<"$files"; then
              code=false
            fi
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "code changes: ${code}"

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        # The `native-tls` feature builds against OpenSSL.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev

      - name: Read pinned Rust toolchain version
        # Single source of truth is rust-toolchain.toml's `channel`.
        # dtolnay/rust-toolchain doesn't parse that file itself, so extract it
        # here and hand it to the toolchain action below (which also installs
        # rustup itself if the runner image has none).
        id: rust_version
        run: |
          version=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/channel *= *"([^"]+)"/\1/')
          if [[ -z "$version" ]]; then
            echo "::error::could not parse channel from rust-toolchain.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-checks-${{ steps.rust_version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-checks-${{ steps.rust_version.outputs.version }}-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (native-tls only)
        # Catches a cfg that only exists with rustls-tls off; the two TLS
        # backends are additive (a consumer can enable both), so
        # --all-features alone would never exercise this combination.
        run: cargo clippy --all-targets --no-default-features --features native-tls -- -D warnings

      - name: Clippy (rustls-tls-native-roots only)
        # The third TLS feature, alone, for the same reason.
        run: cargo clippy --all-targets --no-default-features --features rustls-tls-native-roots -- -D warnings

      - name: Clippy (tower without axum)
        # `--all-features` switches `axum` on, which hides an item only the
        # axum module reads (a dead-code warning that once shipped) in a
        # supported `tower`-only build.
        run: cargo clippy --all-targets --no-default-features --features rustls-tls,tower -- -D warnings

      - name: Clippy (metrics and mcp without axum)
        # The same for `metrics`: its `cfg`s vary with `tower`, not `axum`.
        run: cargo clippy --all-targets --no-default-features --features rustls-tls,metrics,mcp -- -D warnings

      - name: Tests (all features)
        run: cargo test --all-features

      - name: Tests (default features)
        run: cargo test

      - name: Doctests (tower and mcp without axum)
        # `--all-features` compiles every doc example with `axum` on, so an
        # example in the `tower` or `mcp` docs that reaches for
        # `oauth_resource_server::axum` passes there and fails for a consumer
        # who enabled only `mcp`. This is that subset, doctests only.
        run: cargo test --doc --no-default-features --features rustls-tls,mcp

      - name: Build examples (all features)
        # examples/ is documentation that must keep compiling; this is what
        # "compiles in CI" means for it.
        run: cargo build --examples --all-features

      - name: Build docs (-D warnings)
        # #![warn(missing_docs)] plus this: a missing doc comment on a new
        # public item, or a broken rustdoc link, fails the same way a
        # compile warning would.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Install cargo-audit
        # A SHA-pinned action, not a `curl ... | bash` of a mutable branch —
        # this is a security crate's CI, so the install step gets the same
        # supply-chain treatment as every other action here.
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit

      - name: Audit dependencies
        # Reads .cargo/audit.toml automatically.
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny

      - name: Check licenses, bans, sources and advisories
        # Reads deny.toml automatically. Duplicate crate versions are a
        # warning there, not a failure; everything else is.
        run: cargo deny check

      - name: cargo package --list
        # Confirms the `include` list in Cargo.toml actually resolves to the
        # files the package is meant to ship, without building a tarball.
        run: cargo package --list

      - name: cargo publish --dry-run
        # Packages and verifies the crate (metadata, `include` list, doc
        # build inside the package) without uploading anything. This never
        # touches crates.io; only `release.yml`, started by a published
        # GitHub release, does that.
        run: cargo publish --dry-run

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        # `--all-features` below includes `native-tls` (OpenSSL).
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev

      - name: Read MSRV from Cargo.toml
        # Deliberately not `cargo metadata`: that needs a toolchain already
        # installed to run, and this job hasn't installed one yet. Reading the
        # value out of the TOML directly with grep avoids depending on
        # whatever toolchain, if any, the runner image already has.
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/^rust-version *= *"([^"]+)".*/\1/')
          if [[ -z "$version" ]]; then
            echo "::error::could not resolve rust-version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-msrv-${{ steps.msrv.outputs.version }}-

      - name: Build on MSRV (all features)
        # The explicit `+<version>` overrides rust-toolchain.toml, which would
        # otherwise select the pinned development toolchain in this directory.
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+${MSRV}" build --all-features --locked

  semver:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    env:
      SEMVER_TOOLCHAIN: "1.93"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        # `--all-features` below includes `native-tls` (OpenSSL).
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev

      - name: Install Rust 1.93 toolchain (for cargo-semver-checks)
        # Not rust-toolchain.toml's pin: cargo-semver-checks refuses a rustc
        # older than the rustdoc JSON format it reads, and reads the
        # baseline's docs with the same compiler. This toolchain and the
        # install-action `tool:` version below move together: 0.50.0 needs
        # 1.93 or newer. Raise both in one change; a floating `stable` would
        # break every PR (and any release) when a new rustc changes the format.
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ env.SEMVER_TOOLCHAIN }}

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-semver-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-semver-

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-semver-checks@0.50.0

      - name: Check for breaking changes against the latest crates.io release
        # The baseline is the newest version published on crates.io. While
        # `Cargo.toml`'s version equals it, any breaking change fails; a
        # deliberate one (a `0.x` minor bump under this crate's policy) must
        # carry the version bump that announces it.
        run: cargo +1.93 semver-checks check-release --all-features

  feature-powerset:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        # The `native-tls` feature builds against OpenSSL.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev

      - name: Read pinned Rust toolchain version
        id: rust_version
        run: |
          version=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/channel *= *"([^"]+)"/\1/')
          if [[ -z "$version" ]]; then
            echo "::error::could not parse channel from rust-toolchain.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-powerset-${{ steps.rust_version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-powerset-${{ steps.rust_version.outputs.version }}-

      - name: Install cargo-hack
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-hack

      - name: Check every feature combination
        # Every build needs a TLS backend (`compile_error!` otherwise), hence
        # --at-least-one-of. The three backends are additive and only choose
        # which reqwest feature is on, so they are made mutually exclusive
        # here: each is combined with every subset of
        # serde/env/tower/axum/mcp/testing, with `metrics` switched on and off
        # together with `testing` (160 builds as cargo-hack counts them;
        # `axum` and `mcp` both imply `tower`), and the
        # all-features combination, which is where the backends meet, is
        # built by the clippy, test and doc steps in `checks`. Without the
        # exclusion cargo-hack builds all 440
        # combinations for no extra coverage. `metrics` is grouped because
        # no `cfg` of it touches `testing` (or the reverse): its code varies
        # only with `tower`, which the powerset still toggles independently,
        # and a separate axis would double the job (320 builds). --no-dev-deps keeps
        # dev-dependencies (which switch on axum, tokio and serde features)
        # from hiding a feature the library needs and does not enable itself.
        run: |
          cargo hack check --feature-powerset --no-dev-deps \
            --mutually-exclusive-features rustls-tls,native-tls,rustls-tls-native-roots \
            --at-least-one-of rustls-tls,native-tls,rustls-tls-native-roots \
            --group-features metrics,testing

  minimal-versions:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        # `--all-features` below includes `native-tls` (OpenSSL).
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev

      - name: Read pinned Rust toolchain version
        id: rust_version
        run: |
          version=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/channel *= *"([^"]+)"/\1/')
          if [[ -z "$version" ]]; then
            echo "::error::could not parse channel from rust-toolchain.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}

      - name: Install nightly toolchain
        # Only for `cargo update -Z direct-minimal-versions`, which is
        # nightly-only. The build below uses the pinned toolchain.
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: nightly

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-minver-${{ steps.rust_version.outputs.version }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: cargo-minver-${{ steps.rust_version.outputs.version }}-

      - name: Install cargo-hack
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-hack

      - name: Remove dev-dependencies
        # A consumer never resolves them, and their own floors (tower-http's,
        # for one) would otherwise force this crate's bounds up for no reason.
        # Rewrites Cargo.toml in this throwaway checkout only.
        run: cargo hack --remove-dev-deps

      - name: Resolve every direct dependency to its lowest allowed version
        # Rewrites Cargo.lock; nothing after this job's build uses it.
        run: cargo +nightly update -Z direct-minimal-versions

      - name: Lift `time` off its ancient floor
        # `simple_asn1` (via jsonwebtoken) allows `time` 0.3.x from 0.3.0, and
        # `time` before 0.3.35 no longer compiles on current rustc. That is a
        # transitive floor this crate cannot raise, so it is put back to the
        # newest release; every direct dependency stays at its lowest.
        run: cargo update -p time

      - name: Build against the lowest versions
        run: cargo build --all-features

  ci-pass:
    needs: [changes, checks, msrv, semver, feature-powerset, minimal-versions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `needs:` alone would make GitHub SKIP this job (not fail it) when
      # any upstream job fails, and rulesets treat a skipped required check
      # as passing — the ruleset's only required check is this job, so that
      # would silently defeat it. `if: always()` above forces this job to run
      # regardless of upstream outcome, and the explicit result check below
      # is what actually fails it. No upstream job is ever legitimately
      # skipped except when `changes` found only Claude Code config files,
      # where all five are skipped together and the gate passes; otherwise
      # anything but `success` (failure, cancelled, skipped) fails the gate.
      - name: Require every upstream job to have succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          CHECKS: ${{ needs.checks.result }}
          MSRV: ${{ needs.msrv.result }}
          SEMVER: ${{ needs.semver.result }}
          POWERSET: ${{ needs.feature-powerset.result }}
          MINVERS: ${{ needs.minimal-versions.result }}
        run: |
          if [[ "$CHANGES" == "success" && "$CODE" == "false" \
                && "$CHECKS" == "skipped" && "$MSRV" == "skipped" && "$SEMVER" == "skipped" \
                && "$POWERSET" == "skipped" && "$MINVERS" == "skipped" ]]; then
            echo "only Claude Code config changed; heavy jobs skipped"
            exit 0
          fi
          if [[ "$CHECKS" != "success" || "$MSRV" != "success" || "$SEMVER" != "success" \
                || "$POWERSET" != "success" || "$MINVERS" != "success" ]]; then
            echo "::error::one or more required jobs did not succeed (checks=${CHECKS}, msrv=${MSRV}, semver=${SEMVER}, feature-powerset=${POWERSET}, minimal-versions=${MINVERS})"
            exit 1
          fi
          echo "all required checks passed"
