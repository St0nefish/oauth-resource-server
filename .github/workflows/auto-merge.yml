name: Auto-merge

# Arms GitHub's auto-merge (merge commit) on the owner's PRs, so they land as soon
# as `ci-pass` is green. The ruleset still enforces `ci-pass`; this only saves
# the manual click.
#
# The merge must be enabled with a GitHub App token, never GITHUB_TOKEN:
# GitHub starts no new workflow runs for events GITHUB_TOKEN causes, so a
# merge made with it would trigger neither the post-merge CI run on `master`
# (ci.yml's `push` trigger) nor `release.yml`. The App's Client ID is the
# `APP_CLIENT_ID` repo variable and its key the `APP_PRIVATE_KEY` repo secret;
# the token is narrowed to the two permissions merging needs. GitHub withholds
# both from a run triggered by a fork's PR, so this job only works for PRs
# from branches of this repository — which is the intent.
#
# The App deliberately does not hold the `workflows` permission (it would let
# the App rewrite what CI runs). A PR that changes a file under
# `.github/workflows/` still auto-merges when its branch already contains
# master's version of those files (#34). When master has changed a workflow
# file the PR also touches since the branch was cut, the merge commit would
# write workflow content that is not in the PR, and GitHub refuses to let an
# App enable auto-merge without `workflows` (#27). This job then fails; merge
# `master` into the branch and push, or merge by hand once `ci-pass` is green.
#
# Actions are pinned to full commit SHAs, release in the trailing comment.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  auto-merge:
    # Only the owner's PRs auto-merge. Other contributors' PRs still run CI
    # and can be merged manually after review, but must never land unattended.
    if: github.event.pull_request.user.login == 'St0nefish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The App's Client ID (`Iv…`), not its numeric app id: v3
          # deprecates `app-id` in favor of `client-id`.
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # No `workflows` permission: the installation does not grant it (asking
          # for it fails token creation with a 422). Without it, some PRs that
          # change a workflow file cannot be auto-merged — see the header.

      - name: Enable auto-merge
        run: gh pr merge "$PR_NUMBER" --auto --merge --repo "$REPO"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
