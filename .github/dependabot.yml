version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # jsonwebtoken stays on 9.x deliberately -- see the rationale on its
      # dependency comment in Cargo.toml (RUSTSEC-2023-0071 on the 11.x
      # rust_crypto backend, cmake/C toolchain requirement on aws_lc_rs).
      # Minor/patch updates within 9.x are still welcome.
      - dependency-name: "jsonwebtoken"
        update-types: ["version-update:semver-major"]

  # The cargo-fuzz crate (fuzz/) is its own package with its own lock file.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # fuzz/ depends on this crate by path, so a jsonwebtoken bump found here
      # rewrites the root Cargo.toml too. Same 9.x pin as the root entry above.
      - dependency-name: "jsonwebtoken"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
