# cargo-deny configuration, run by the `cargo deny check` step in
# .github/workflows/checks.yml's `audit` job. Covers the four checks:
# advisories, licenses, bans and sources.
#
# The graph is every feature of every target: a consumer can enable any of the
# additive TLS backends, `axum` and the rest, so a licence or advisory in any
# of them is a licence or advisory this crate hands to someone.
[graph]
all-features = true

[advisories]
# Deliberately empty, and kept in step with `.cargo/audit.toml`'s `ignore`
# (also empty): a vulnerability advisory is ignored in BOTH files or neither.
# That rule covers vulnerabilities only; the two tools treat yanked and
# unmaintained crates differently (see below). Add an entry only for a genuine
# false positive, with the reason and what would let it be removed. The
# RustSec database is fetched fresh on every run.
ignore = []
# A yanked release is one its own author withdrew (often for a bug or a
# vulnerability); fail on one rather than warn.
yanked = "deny"
# Unmaintained crates: direct dependencies only. A transitive crate going
# unmaintained is not something this crate can act on before its own
# dependency does, and failing every PR on it would block security releases;
# `cargo audit` still lists such advisories as warnings. Unsound and
# vulnerable advisories are checked across the whole tree regardless.
unmaintained = "workspace"

[licenses]
# Every licence in the current dependency tree, and nothing else. A new
# dependency that brings a licence not listed here fails CI and has to be
# looked at, which is the point. An `OR` expression passes when any one
# alternative is allowed: `r-efi` offers LGPL-2.1-or-later only as an
# alternative to MIT and Apache-2.0, and `memchr` offers Unlicense alongside MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    # `ryu`, alongside Apache-2.0.
    "BSL-1.0",
    # ICU4X and its data crates, via `url`'s IDNA handling.
    "Unicode-3.0",
    # `webpki-roots`: the Mozilla root set, which is data rather than code.
    "CDLA-Permissive-2.0",
]
# `ring` needs no `[[licenses.clarify]]` entry: 0.17.14 declares
# `Apache-2.0 AND ISC` in its manifest, which cargo-deny reads directly and
# which the two entries above already satisfy. (Older 0.16.x releases declared
# no licence expression and did need a clarification; revisit if a `ring`
# release drops the expression again.)
confidence-threshold = 0.93

[bans]
# Two versions of one crate in the tree: worth seeing, not worth failing on
# (a dependency two steps down often pins its own).
multiple-versions = "warn"
wildcards = "deny"
# Not banned, on purpose: a second TLS stack. `rustls-tls`,
# `rustls-tls-native-roots` and `native-tls` are additive features a consumer
# may enable together, so the all-features graph above contains both rustls and
# OpenSSL by design and banning either would fail every run. cargo-deny cannot
# make a per-crate ban a warning (`deny` entries are always errors), so the
# duplicate-TLS-stack signal is the `multiple-versions` warning plus the
# feature matrix CI already builds.

[sources]
# crates.io only: no git dependencies and no alternate registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
